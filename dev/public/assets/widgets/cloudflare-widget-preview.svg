<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Background -->
  <rect width="400" height="240" rx="10" fill="#1a1a2e"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#ffffff08" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="240" stroke="#ffffff08" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="240" stroke="#ffffff08" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="240" stroke="#ffffff08" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="240" stroke="#ffffff08" stroke-width="1"/>

  <!-- Decorative area chart (orange, faint) -->
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F6821F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0,200 L40,185 L80,170 L120,150 L160,140 L200,155 L240,130 L280,110 L320,125 L360,100 L400,115 L400,240 L0,240 Z" fill="url(#chartGrad)"/>
  <path d="M0,200 L40,185 L80,170 L120,150 L160,140 L200,155 L240,130 L280,110 L320,125 L360,100 L400,115" fill="none" stroke="#F6821F" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Cloudflare cloud logo (centered top half) -->
  <!-- Cloud shape using Cloudflare's iconic orange cloud -->
  <g transform="translate(200,88) scale(2.6)">
    <!-- Cloud body -->
    <path d="M22.5 14.5c0.1-0.4 0.1-0.8 0.1-1.2 0-4-3.2-7.3-7.2-7.3-2.9 0-5.4 1.7-6.6 4.2C8.2 9.9 7.4 9.7 6.5 9.7c-3 0-5.5 2.4-5.5 5.4 0 0.1 0 0.2 0 0.3C0.4 15.6 0 16.2 0 16.9c0 1.1 0.9 2 2 2h19.3c1.5 0 2.7-1.2 2.7-2.7C24 15.5 23.4 14.8 22.5 14.5z" fill="#F6821F"/>
    <!-- Cloud highlight -->
    <path d="M20 15.8c0.1-0.3 0.1-0.6 0.1-0.9 0-3-2.4-5.5-5.4-5.5-2.2 0-4.1 1.3-5 3.2-0.5-0.3-1.1-0.4-1.7-0.4-2.3 0-4.1 1.8-4.1 4.1 0 0.1 0 0.1 0 0.2C3.5 16.7 3.2 17.1 3.2 17.6c0 0.8 0.7 1.5 1.5 1.5h14.5c1.1 0 2-0.9 2-2C21.2 16.5 20.7 16 20 15.8z" fill="#FBAD41" opacity="0.6"/>
  </g>

  <!-- "Cloudflare" label -->
  <text x="200" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#F6821F" text-anchor="middle" letter-spacing="1">CLOUDFLARE</text>
  <text x="200" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff55" text-anchor="middle" letter-spacing="2">ANALYTICS</text>

  <!-- Bottom stat pills -->
  <rect x="30" y="200" width="80" height="22" rx="4" fill="#F6821F22"/>
  <text x="70" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#F6821F" text-anchor="middle" font-weight="600">REQUESTS</text>

  <rect x="125" y="200" width="80" height="22" rx="4" fill="#38bdf822"/>
  <text x="165" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="600">BANDWIDTH</text>

  <rect x="220" y="200" width="80" height="22" rx="4" fill="#22c55e22"/>
  <text x="260" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle" font-weight="600">CACHE RATE</text>

  <rect x="315" y="200" width="58" height="22" rx="4" fill="#ef444422"/>
  <text x="344" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="600">THREATS</text>
</svg>
